<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenFeed - Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Ensure cursor pointer for all interactive elements */
        button, .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col">

    <!-- ================= INITIAL LOADING SCREEN ================= -->
    <div id="init-loader" class="fixed inset-0 bg-green-50 z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <i data-lucide="leaf" class="w-12 h-12 text-green-600 animate-bounce mb-4"></i>
        <p class="text-green-800 font-semibold" id="loader-message">Connecting to database...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ensure icons are created when the DOM is ready, covering both views
            if (typeof lucide !== 'undefined') { lucide.createIcons(); }
        });
    </script>

    <!-- ================= LOGIN SCREEN (DEFAULT VISIBLE) ================= -->
    <div id="auth-view" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-green-100 fade-in">
            <div class="bg-green-600 p-6 text-center">
                <i data-lucide="leaf" class="w-12 h-12 text-white mx-auto mb-2"></i>
                <h1 class="text-2xl font-bold text-white">Welcome to GreenFeed</h1>
                <p class="text-green-100 text-sm">Real-time Social Feed</p>
            </div>
            
            <div class="p-8">
                <!-- Auth Message Area (Will be styled red for errors, green for success) -->
                <div id="auth-error" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg mb-4 border border-red-100 flex items-start transition-colors duration-150">
                    <i data-lucide="alert-circle" class="w-4 h-4 mr-2 mt-0.5 flex-shrink-0"></i>
                    <span id="auth-error-text">Message</span>
                </div>

                <!-- Email/Pass Form -->
                <form id="email-auth-form" onsubmit="event.preventDefault(); window.handleEmailAuth(event);">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Email</label>
                            <input type="email" id="email-input" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="you@example.com">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Password</label>
                            <input type="password" id="password-input" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="••••••••">
                        </div>
                        
                        <div class="flex space-x-3 pt-2">
                            <!-- Buttons are disabled until Firebase is initialized -->
                            <button name="action" value="signin" id="btn-signin" type="submit" disabled class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition transform active:scale-95 disabled:opacity-50 disabled:cursor-wait">
                                Sign In
                            </button>
                            <button name="action" value="signup" id="btn-signup" type="submit" disabled class="flex-1 bg-white hover:bg-green-50 text-green-700 border border-green-200 font-bold py-2 px-4 rounded-lg transition transform active:scale-95 disabled:opacity-50 disabled:cursor-wait">
                                Sign Up
                            </button>
                        </div>
                    </div>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
                    <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">Or continue with</span></div>
                </div>

                <div class="space-y-3">
                    <button onclick="window.handleAnon()" id="btn-anon" class="w-full flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium py-2.5 px-4 rounded-lg transition transform active:scale-95 disabled:opacity-50 disabled:cursor-wait" disabled>
                        <i data-lucide="ghost" class="w-5 h-5 mr-2"></i>
                        Continue as Guest
                    </button>
                    <button onclick="window.handleGoogle()" id="btn-google" class="w-full flex items-center justify-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition transform active:scale-95 disabled:opacity-50 disabled:cursor-wait" disabled>
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                        Google
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= APP SCREEN (Starts Hidden) ================= -->
    <div id="app-view" class="flex-grow flex flex-col hidden">
        <!-- Navbar -->
        <nav class="bg-green-600 text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-2xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-2 font-bold text-xl cursor-pointer" onclick="window.scrollTo(0,0)">
                        <i data-lucide="leaf" class="w-6 h-6"></i>
                        <span>GreenFeed</span>
                    </div>
                    <div class="flex items-center space-x-3">
                        <button onclick="window.openProfileModal()" class="flex items-center space-x-2 hover:bg-green-700 px-3 py-1.5 rounded-full transition group border border-transparent hover:border-green-400">
                            <div class="w-8 h-8 bg-green-200 text-green-800 rounded-full flex items-center justify-center font-bold text-sm border-2 border-green-500 group-hover:border-white transition" id="nav-avatar">U</div>
                            <span id="nav-username" class="text-sm font-medium hidden sm:block max-w-[100px] truncate">User</span>
                        </button>
                        <button id="btn-signout" onclick="window.handleSignOut()" class="p-2 hover:bg-green-700 rounded-full transition text-green-100 hover:text-white" title="Sign Out">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow max-w-2xl w-full mx-auto px-4 py-6">
            
            <!-- Create Post -->
            <div class="bg-white rounded-xl shadow-sm border border-green-100 p-4 mb-6 fade-in">
                <div class="flex space-x-3">
                    <div class="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center flex-shrink-0 font-bold" id="post-avatar">
                        U
                    </div>
                    <div class="flex-1">
                        <textarea id="post-input" rows="2" placeholder="What's happening?" 
                            class="w-full bg-gray-50 border-none rounded-lg p-3 focus:ring-2 focus:ring-green-500 focus:bg-white transition resize-none outline-none text-sm md:text-base"></textarea>
                    </div>
                </div>
                <div class="flex justify-end items-center mt-3 pt-3 border-t border-gray-100">
                    <button onclick="window.createPost()" id="btn-post" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full font-medium transition shadow-md transform active:scale-95 flex items-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="send" class="w-4 h-4 mr-2"></i>
                        Post
                    </button>
                </div>
            </div>

            <!-- Feed -->
            <div id="feed-loader" class="text-center py-10 hidden">
                <i data-lucide="loader-2" class="w-8 h-8 text-green-500 animate-spin mx-auto"></i>
                <p class="text-gray-400 text-sm mt-2">Loading updates...</p>
            </div>
            
            <div id="feed-container" class="space-y-4 pb-10 min-h-[200px]">
                <!-- Posts go here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16 fade-in">
                <div class="bg-green-50 w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="wind" class="w-8 h-8 text-green-400"></i>
                </div>
                <h3 class="text-lg font-semibold text-gray-700">It's quiet here...</h3>
                <p class="text-gray-500 text-sm mt-1">Be the first to share something!</p>
            </div>
        </main>
    </div>

    <!-- ================= PROFILE MODAL ================= -->
    <div id="profile-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden transform transition-all scale-100">
            <div class="bg-green-600 p-4 flex justify-between items-center">
                <h3 class="text-white font-bold text-lg">Edit Profile</h3>
                <button onclick="window.closeProfileModal()" class="text-green-100 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Display Name</label>
                <input type="text" id="display-name-input" class="w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none mb-4" placeholder="Enter new name">
                
                <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Account Type</label>
                <div class="bg-gray-100 p-3 rounded-lg text-sm text-gray-600 mb-6 flex items-center">
                    <i data-lucide="shield" class="w-4 h-4 mr-2 text-green-600"></i>
                    <span id="account-type-display">Loading...</span>
                </div>

                <button onclick="window.saveProfile()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition transform active:scale-95">
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT MODULES ================= -->
    <script type="module">
        // --- Firebase Imports (Latest Version 11.6.1) ---
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInAnonymously,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            updateProfile,
            signInWithCustomToken,
            setLogLevel 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            onSnapshot, 
            serverTimestamp, 
            limit 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Global Firebase Instances (Set later) ---
        let auth = null;
        let db = null;
        let currentUser = null;
        let unsubscribeFeed = null;
        let appId = 'greenfeed-demo'; 
        let isFirebaseReady = false; 

        // --- DOM Elements ---
        const views = {
            auth: document.getElementById('auth-view'),
            app: document.getElementById('app-view'),
            loader: document.getElementById('feed-loader'),
            empty: document.getElementById('empty-state'),
            feed: document.getElementById('feed-container'),
            modal: document.getElementById('profile-modal'),
            error: document.getElementById('auth-error'),
            initLoader: document.getElementById('init-loader')
        };

        const inputs = {
            email: document.getElementById('email-input'),
            pass: document.getElementById('password-input'),
            post: document.getElementById('post-input'),
            displayName: document.getElementById('display-name-input')
        };

        const text = {
            navUser: document.getElementById('nav-username'),
            navAvatar: document.getElementById('nav-avatar'),
            postAvatar: document.getElementById('post-avatar'),
            errorText: document.getElementById('auth-error-text'),
            accType: document.getElementById('account-type-display'),
            loaderMsg: document.getElementById('loader-message')
        };

        const buttons = {
            signIn: document.getElementById('btn-signin'),
            signUp: document.getElementById('btn-signup'),
            anon: document.getElementById('btn-anon'),
            google: document.getElementById('btn-google')
        };

        // --- Message Display Functions ---

        /** Shows a success message. */
        function showSuccessMessage(msg) {
            if (!views.error || !text.errorText) return;
            
            text.errorText.textContent = msg;
            views.error.classList.remove('hidden');
            views.error.classList.remove('bg-red-50', 'text-red-600', 'border-red-100');
            views.error.classList.add('bg-green-100', 'text-green-700', 'border-green-200');
        }
        
        /** Shows an actual Firebase error message. */
        function showFirebaseError(msg) {
            if (!views.error || !text.errorText) return;
            
            // Clean up common Firebase prefix for readability
            text.errorText.textContent = msg.replace('Firebase: ', '').replace('(auth/', ' (');
            views.error.classList.remove('hidden');
            
            views.error.classList.remove('bg-green-100', 'text-green-700', 'border-green-200');
            views.error.classList.add('bg-red-50', 'text-red-600', 'border-red-100');
        }

        /** Clears the message box. */
        function clearAuthMessage() {
            if (views.error) views.error.classList.add('hidden');
            views.error.classList.remove('bg-green-100', 'text-green-700', 'border-green-200');
            views.error.classList.add('bg-red-50', 'text-red-600', 'border-red-100');
        }

        // --- Control Button State ---
        function setAuthButtonsEnabled(enabled) {
            const cursor = enabled ? 'pointer' : 'wait';
            for (const key in buttons) {
                if (buttons[key]) {
                    buttons[key].disabled = !enabled;
                    buttons[key].style.cursor = cursor;
                }
            }
            if (text.loaderMsg) {
                text.loaderMsg.textContent = enabled ? 'Ready to use!' : 'Connecting to database...';
            }
            // Hide the initial loader once everything is ready
            if (enabled && views.initLoader) {
                 views.initLoader.style.opacity = '0';
                 setTimeout(() => views.initLoader.classList.add('hidden'), 300);
            }
        }

        // 1. --- CRITICAL FIX: Implement fallback values and robust initialization ---
        
        const initializeFirebaseAndAuth = async () => {
            let config = {};
            let token = null;

            // Polling loop to wait for environment variables, maximum of 10 checks (2 seconds)
            let attempts = 0;
            const maxAttempts = 10;
            const pollInterval = 200; // 200ms

            while (attempts < maxAttempts) {
                if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                    try {
                        config = JSON.parse(__firebase_config);
                        if (typeof __initial_auth_token !== 'undefined') {
                            token = __initial_auth_token;
                        }
                        appId = typeof __app_id !== 'undefined' ? __app_id : 'greenfeed-demo';
                        break; // Exit loop if successful
                    } catch(e) {
                         console.error("Failed to parse Firebase config:", e);
                         break; // Exit loop if parsing fails
                    }
                }
                if (text.loaderMsg) text.loaderMsg.textContent = `Waiting for configuration... (Attempt ${attempts + 1}/${maxAttempts})`;
                await new Promise(resolve => setTimeout(resolve, pollInterval));
                attempts++;
            }

            // Fallback if environment variables are still missing after polling
            if (Object.keys(config).length === 0) {
                 console.warn("Using fallback configuration for Firebase initialization.");
                 showFirebaseError("Warning: Failed to load database configuration. Only anonymous login may work.");
                 config = { apiKey: "fallback", authDomain: "fallback", projectId: "fallback" };
                 token = 'fallback'; // Ensures sign-in doesn't try to use a missing token
            }

            // Proceed with Initialization
            try {
                // Initialize App only if not already initialized
                const app = getApps().length === 0 ? initializeApp(config) : getApp();
                auth = getAuth(app);
                db = getFirestore(app);
                setLogLevel('debug'); 

                // Initial Custom Token Sign-In Attempt (silent background auth)
                if (token && token !== 'fallback') {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                // Setup Auth State Listener AFTER initialization
                onAuthStateChanged(auth, (user) => {
                    currentUser = user;
                    if (user) {
                        // User is logged in: Show the App, Hide Auth
                        showView('app');
                        updateUserProfileUI(user);
                        loadFeed();
                    } else {
                        // User is logged out: Show Auth, Hide App
                        showView('auth');
                        if (unsubscribeFeed) unsubscribeFeed();
                    }
                    // Recreate icons regardless of auth state
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                });
                
                // Set ready flag and enable buttons
                isFirebaseReady = true;
                setAuthButtonsEnabled(true);
                console.log("Firebase initialized and ready.");

            } catch (e) {
                console.error("Fatal Firebase Initialization Error:", e);
                // Set ready to true so the user can see the buttons and error message
                isFirebaseReady = true; 
                setAuthButtonsEnabled(true); 
                showFirebaseError(`Setup Error: Initialization failed. ${e.message}. Please check console.`);
            }
        };

        // Start the check immediately, the function now handles the polling
        initializeFirebaseAndAuth();

        // 2. Auth Actions (Exposed to window for HTML event handlers)
        
        window.handleEmailAuth = async (event) => {
            // CRITICAL CHECK: Ensure we are ready to talk to Firebase
            if (!isFirebaseReady) {
                showFirebaseError("App not ready. Please wait a moment for the buttons to activate, or try refreshing.");
                return;
            }

            const action = event.submitter ? event.submitter.value : null;
            if (!action) return;
            
            clearAuthMessage();

            const email = inputs.email.value.trim();
            const password = inputs.pass.value.trim();

            if (!email || !password) {
                showFirebaseError("Please enter both your email and password to proceed.");
                return;
            }

            // Temporarily disable buttons during the operation
            setAuthButtonsEnabled(false);

            if (action === 'signin') {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (e) { 
                    showFirebaseError(e.message); 
                }
            } else if (action === 'signup') {
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    const name = email.split('@')[0];
                    await updateProfile(cred.user, { displayName: name });
                    updateUserProfileUI(cred.user); 
                    showSuccessMessage("Success! Your account has been created and you are now signed in.");
                } catch (e) { 
                    showFirebaseError(e.message); 
                }
            }
            // Re-enable buttons if sign-in failed (auth listener handles re-enabling if successful)
            if (!auth.currentUser) {
                 setAuthButtonsEnabled(true);
            }
        };


        window.handleGoogle = async () => {
            if (!isFirebaseReady) {
                showFirebaseError("App not ready. Please wait a moment for the buttons to activate, or try refreshing.");
                return;
            }
            clearAuthMessage();
            setAuthButtonsEnabled(false);
            try {
                const provider = new GoogleAuthProvider();
                // NOTE: signInWithPopup is commented out as it requires a polyfill for the environment
                // await signInWithPopup(auth, provider);
                showFirebaseError("Google Sign-In is not currently supported in this environment. Please use Email/Password or Guest.");
            } catch (e) { 
                showFirebaseError(e.message); 
            } finally {
                setAuthButtonsEnabled(true);
            }
        };

        window.handleAnon = async () => {
            if (!isFirebaseReady) {
                showFirebaseError("App not ready. Please wait a moment for the buttons to activate, or try refreshing.");
                return;
            }
            clearAuthMessage();
            setAuthButtonsEnabled(false);
            try { 
                await signInAnonymously(auth); 
            } catch (e) { 
                showFirebaseError(e.message); 
            } finally {
                if (!auth.currentUser) {
                    setAuthButtonsEnabled(true);
                }
            }
        };

        window.handleSignOut = async () => {
            if (!auth) return;
            try { await signOut(auth); } catch (e) { console.error(e); }
        };

        // --- UI Helpers ---

        function showView(viewName) {
            if (views.auth) views.auth.classList.add('hidden');
            if (views.app) views.app.classList.add('hidden');
            if (views[viewName]) views[viewName].classList.remove('hidden');
            if (viewName === 'auth') clearAuthMessage();
        }

        function updateUserProfileUI(user) {
            const name = user.displayName || (user.isAnonymous ? "Guest" : "User");
            const initial = name[0] ? name[0].toUpperCase() : "U";
            
            if (text.navUser) text.navUser.textContent = name;
            if (text.navAvatar) text.navAvatar.textContent = initial;
            if (text.postAvatar) text.postAvatar.textContent = initial;
            
            if (inputs.displayName) inputs.displayName.value = name;
            if (text.accType) text.accType.textContent = user.isAnonymous ? "Guest Session" : (user.email ? "Email Account" : "Google Account");
        }

        // --- Profile Modal ---

        window.openProfileModal = () => {
            if (views.modal) views.modal.classList.remove('hidden');
            if (currentUser && inputs.displayName) inputs.displayName.value = currentUser.displayName || "";
        };

        window.closeProfileModal = () => {
            if (views.modal) views.modal.classList.add('hidden');
        };

        window.saveProfile = async () => {
            const newName = inputs.displayName.value.trim();
            if (!newName || !currentUser) return;

            try {
                await updateProfile(currentUser, { displayName: newName });
                updateUserProfileUI(currentUser);
                closeProfileModal();
            } catch (e) {
                console.error("Error saving profile:", e);
                showFirebaseError("Failed to save profile. See console for details.");
            }
        };

        // --- Feed Logic ---

        function loadFeed() {
            if (!db || !views.loader || !views.empty || !views.feed) return;
            
            views.loader.classList.remove('hidden');
            views.empty.classList.add('hidden');
            
            const q = query(
                collection(db, 'artifacts', appId, 'public', 'data', 'posts'),
                // orderBy('createdAt', 'desc'), // Removed orderBy to avoid index requirement issues
                limit(50)
            );

            unsubscribeFeed = onSnapshot(q, (snapshot) => {
                views.loader.classList.add('hidden');
                views.feed.innerHTML = ''; 

                let posts = [];
                snapshot.forEach(doc => {
                    posts.push({...doc.data(), id: doc.id});
                });
                
                // Sort in memory by time, as orderBy is forbidden
                posts.sort((a, b) => {
                    const timeA = a.createdAt && a.createdAt.toDate ? a.createdAt.toDate().getTime() : 0;
                    const timeB = b.createdAt && b.createdAt.toDate ? b.createdAt.toDate().getTime() : 0;
                    return timeB - timeA; // Descending order
                });

                if (posts.length === 0) {
                    views.empty.classList.remove('hidden');
                } else {
                    views.empty.classList.add('hidden');
                    posts.forEach(post => {
                        renderPost(post, post.id);
                    });
                }
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, (error) => {
                console.error("Feed Error:", error);
                views.loader.classList.add('hidden');
                showFirebaseError(`Feed loading failed. Check console for details: ${error.message}`);
            });
        }

        window.createPost = async () => {
            const content = inputs.post.value.trim();
            if (!content || !currentUser || !db) return;

            const btn = document.getElementById('btn-post');
            if (!btn) return;
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin"></i> Sending...`;
            if (typeof lucide !== 'undefined') lucide.createIcons();

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'posts'), {
                    content: content,
                    authorId: currentUser.uid,
                    authorName: currentUser.displayName || "Anonymous",
                    createdAt: serverTimestamp(),
                    likes: 0
                });
                inputs.post.value = '';
            } catch (e) {
                console.error("Post failed", e);
                showFirebaseError("Failed to post. Check console."); 
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="send" class="w-4 h-4 mr-2"></i> Post`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        };

        function renderPost(post, id) {
            const div = document.createElement('div');
            div.className = "bg-white p-5 rounded-xl shadow-sm border border-green-50 fade-in mb-4 hover:shadow-md transition duration-200";
            
            let timeStr = "Just now";
            if (post.createdAt && post.createdAt.toDate) { 
                const date = post.createdAt.toDate();
                timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            const name = post.authorName || "Anonymous";
            const initial = name[0] ? name[0].toUpperCase() : "U";
            const isMe = currentUser && post.authorId === currentUser.uid;

            div.innerHTML = `
                <div class="flex space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br ${isMe ? 'from-green-500 to-green-700' : 'from-gray-400 to-gray-600'} rounded-full flex items-center justify-center text-white font-bold shadow-sm flex-shrink-0">
                        ${initial}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2 overflow-hidden">
                                <h4 class="font-bold text-gray-900 truncate">${name}</h4>
                                <span class="text-gray-400 text-xs flex-shrink-0">${timeStr}</span>
                            </div>
                            ${isMe ? '<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-medium">You</span>' : ''}
                        </div>
                        <p class="mt-1 text-gray-800 leading-relaxed whitespace-pre-line break-words text-sm md:text-base">${post.content}</p>
                    </div>
                </div>
            `;
            if (views.feed) views.feed.appendChild(div);
        }

        // --- Keyboard Shortcut for Posting (Desktop only) ---
        if (inputs.post) {
            inputs.post.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                    window.createPost();
                }
            });
        }
    </script>
</body>
</html>
