<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenFeed - Client TTL & Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .modal {
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-4 sm:p-8">
        <div class="max-w-3xl mx-auto">
            <header class="mb-8 flex justify-between items-center">
                <div>
                    <h1 class="text-4xl font-extrabold text-green-700">GreenFeed 🌱</h1>
                    <p class="text-gray-500 mt-1">Share something positive today.</p>
                </div>
                <button id="profileBtn" class="flex items-center space-x-2 px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="profileBtnText">Sign In / Profile</span>
                </button>
            </header>

            <div class="text-sm text-indigo-700 mt-3 p-3 bg-indigo-100 rounded-lg shadow-inner flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                **TTL Active:** This app automatically deletes posts older than **30 days** on load.
            </div>

            <div id="loadingIndicator" class="flex justify-center items-center h-20 text-indigo-600 font-semibold text-lg">
                <svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                Initializing Feed...
            </div>

            <div id="mainContent" class="hidden">
                <!-- Input Form -->
                <form id="postForm" class="mb-8 mt-6 bg-white p-6 rounded-xl shadow-lg border border-gray-100">
                    <textarea
                        id="newItemText"
                        placeholder="What's your positive thought for the day?"
                        rows="3"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 transition-shadow resize-none"
                        required
                    ></textarea>
                    <button
                        type="submit"
                        id="postBtn"
                        disabled
                        class="mt-3 w-full flex items-center justify-center px-6 py-2 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition duration-150 disabled:bg-green-300"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        Post to Feed
                    </button>
                </form>

                <!-- Feed List -->
                <h2 class="text-2xl font-bold text-gray-700 mb-4 border-b pb-2">Feed History (<span id="feedCount">0</span> Items)</h2>
                
                <div id="feedList" class="space-y-4">
                    <p class="text-gray-500 p-4 text-center border-dashed border-2 rounded-xl">
                        The feed is empty. Post the first item!
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Authentication Modal -->
    <div id="authModal" class="modal fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50 invisible opacity-0">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md transform transition-all p-6">
            <h2 id="modalTitle" class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">Sign In / Profile</h2>
            
            <div id="profileSection" class="hidden">
                <p class="text-gray-600 mb-4">You are signed in as: <span id="currentEmail" class="font-medium text-indigo-600"></span></p>
                <p class="text-sm text-gray-400 mb-4">User ID: <span id="currentUid" class="font-mono text-xs"></span></p>

                <form id="updateNameForm" class="mb-4">
                    <label for="displayNameInput" class="block text-sm font-medium text-gray-700">Display Name</label>
                    <input type="text" id="displayNameInput" class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
                    <button type="submit" class="mt-3 w-full px-4 py-2 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700">
                        Update Display Name
                    </button>
                </form>

                <button id="signOutBtn" class="w-full px-4 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-700">
                    Sign Out
                </button>
            </div>

            <div id="signInSection">
                <!-- Social Sign-in -->
                <div class="space-y-3 mb-6">
                    <button id="googleSignInBtn" class="w-full flex items-center justify-center px-4 py-3 border border-gray-300 rounded-lg shadow-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition">
                        <svg class="w-5 h-5 mr-3" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.341c-1.637 5.765-7.018 9.923-13.341 9.923-8.834 0-15.992-7.158-15.992-15.992S14.166 12.008 23 12.008c3.88 0 7.317 1.258 10.002 3.332l5.657-5.657C34.092 5.86 28.537 3.992 23 3.992 11.4 3.992 1.992 13.4 1.992 25s9.408 21.008 21.008 21.008c11.758 0 20.898-8.995 20.898-20.898 0-1.254-.105-2.5-.286-3.719z" clip-rule="evenodd"/><path fill="#FF3D00" d="M6.307 28.008c-.024-1.921-.04-3.856 0-5.789-.004-.378-.008-.756-.008-1.135 0-.582.022-1.163.064-1.742h-3.331c-.131.782-.204 1.576-.204 2.385 0 1.284.14 2.56.402 3.793z"/><path fill="#4CAF50" d="M23 45.008c5.463 0 10.384-2.124 14.168-5.467l-5.657-5.657c-2.486 1.708-5.672 2.724-8.511 2.724-4.821 0-8.98-2.618-11.144-6.417h-5.657c3.27 6.425 9.771 10.82 17.101 10.82z"/><path fill="#1976D2" d="M43.611 20.083h-20.619v-8h11.341c-.435-1.916-1.146-3.791-2.222-5.454l-5.657-5.657c-2.736-2.074-6.173-3.332-10.002-3.332C11.4 4.008 1.992 13.416 1.992 25c0 1.284.14 2.56.402 3.793l5.657-5.657c1.472-2.73 3.655-5.068 6.273-6.903z"/></svg>
                        Sign in with Google
                    </button>
                    <button id="anonSignInBtn" class="w-full px-4 py-3 bg-gray-200 text-gray-700 font-semibold rounded-lg shadow-sm hover:bg-gray-300 transition">
                        Sign in Anonymously
                    </button>
                </div>
                
                <div class="flex items-center my-4">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-500 text-sm">OR</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- Email/Password Form -->
                <form id="emailAuthForm" class="space-y-4">
                    <input type="email" id="emailInput" placeholder="Email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required>
                    <input type="password" id="passwordInput" placeholder="Password (min 6 chars)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" required minlength="6">
                    <button type="submit" id="emailSubmitBtn" class="w-full px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">
                        Sign In / Sign Up
                    </button>
                    <p id="authMessage" class="text-sm text-center text-red-500"></p>
                </form>
            </div>

            <div class="flex justify-end mt-4">
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, 
            signInWithPopup, GoogleAuthProvider, 
            createUserWithEmailAndPassword, signInWithEmailAndPassword, 
            signOut, updateProfile
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, onSnapshot, query, where, 
            addDoc, writeBatch, getDocs, doc, setDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration & Global State: Using secure environment variables ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        const TTL_DAYS = 30;
        const POSTS_COLLECTION = 'green_feed_posts';
        const PROFILES_COLLECTION = 'profiles';

        let app;
        let db;
        let auth;
        let currentUser = null;
        let isAuthReady = false;

        // --- DOM Elements ---
        const loadingIndicator = document.getElementById('loadingIndicator');
        const mainContent = document.getElementById('mainContent');
        const postForm = document.getElementById('postForm');
        const newItemText = document.getElementById('newItemText');
        const postBtn = document.getElementById('postBtn');
        const feedList = document.getElementById('feedList');
        const feedCount = document.getElementById('feedCount');
        
        // Modal Elements
        const authModal = document.getElementById('authModal');
        const profileBtn = document.getElementById('profileBtn');
        const profileBtnText = document.getElementById('profileBtnText');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const profileSection = document.getElementById('profileSection');
        const signInSection = document.getElementById('signInSection');
        const currentEmail = document.getElementById('currentEmail');
        const currentUid = document.getElementById('currentUid');
        const displayNameInput = document.getElementById('displayNameInput');
        const updateNameForm = document.getElementById('updateNameForm');
        const signOutBtn = document.getElementById('signOutBtn');
        const googleSignInBtn = document.getElementById('googleSignInBtn');
        const anonSignInBtn = document.getElementById('anonSignInBtn');
        const emailAuthForm = document.getElementById('emailAuthForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const authMessage = document.getElementById('authMessage');

        // --- Utility Functions ---

        /** Determines the correct private Firestore path for the user's data. */
        function getCollectionPath(collectionName) {
            if (!currentUser) return null;
            // Private path: /artifacts/{appId}/users/{userId}/collectionName
            return `artifacts/${appId}/users/${currentUser.uid}/${collectionName}`;
        }

        /** Formats a timestamp (ms) into a readable date string. */
        function formatTimestamp(ms) {
            return new Date(ms).toLocaleString();
        }

        /** Shows a message in the auth modal and clears it after a delay. */
        function displayAuthMessage(message, isError = true) {
            authMessage.textContent = message;
            authMessage.className = `text-sm text-center mt-2 ${isError ? 'text-red-500' : 'text-green-500'}`;
            setTimeout(() => { authMessage.textContent = ''; }, 3000);
        }

        // --- Firestore Profile Management ---
        /** Saves or updates the user's profile document with display name and email. */
        async function saveUserProfile(user) {
            const profilePath = getCollectionPath(PROFILES_COLLECTION);
            if (!profilePath) return;

            const profileDocRef = doc(db, profilePath, 'data');

            // Determine display name: use Firebase Auth display name or default
            const nameToSave = user.displayName || 'Anonymous User';

            try {
                await setDoc(profileDocRef, {
                    uid: user.uid,
                    displayName: nameToSave,
                    email: user.email || 'N/A',
                    isAnonymous: user.isAnonymous,
                    lastLogin: Date.now()
                }, { merge: true });
            } catch (error) {
                console.error("Error saving user profile:", error);
            }
        }

        // --- TTL and Cleanup Logic ---

        /** Cleans up documents older than TTL_DAYS using a batch write. */
        async function checkAndDeleteOldData() {
            if (!isAuthReady || !currentUser) return;

            console.log("--- GreenFeed TTL Check Initiated ---");
            const cutoffTime = Date.now() - (TTL_DAYS * 24 * 60 * 60 * 1000);
            const dataPath = getCollectionPath(POSTS_COLLECTION);
            if (!dataPath) return;

            const q = query(
                collection(db, dataPath),
                where('createdAt', '<', cutoffTime)
            );

            try {
                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    console.log(`✅ TTL: No items found older than ${TTL_DAYS} days.`);
                    return;
                }

                const batch = writeBatch(db);
                snapshot.forEach((docSnap) => {
                    batch.delete(docSnap.ref);
                });

                await batch.commit();
                console.log(`🔥 TTL Cleanup Success: Deleted ${snapshot.size} item(s) older than ${TTL_DAYS} days.`);
            } catch (error) {
                console.error("❌ Error during client-side TTL cleanup:", error);
            }
        }

        // --- Authentication Handlers ---

        function updateUIForUser(user) {
            currentUser = user;
            const isLoggedIn = !!user;

            postBtn.disabled = !isLoggedIn;
            mainContent.classList.toggle('hidden', !isLoggedIn);
            loadingIndicator.classList.toggle('hidden', true);

            if (isLoggedIn) {
                const name = user.displayName || (user.isAnonymous ? 'Guest' : user.email);
                profileBtnText.textContent = name.split('@')[0];
                
                // Update Modal
                signInSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                currentEmail.textContent = user.email || 'Anonymous';
                currentUid.textContent = user.uid;
                displayNameInput.value = user.displayName || '';
            } else {
                profileBtnText.textContent = 'Sign In / Profile';
                signInSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
            }
        }

        // --- Fix implemented here: Provider instantiation inside handler ---
        googleSignInBtn.addEventListener('click', async () => {
            if (!auth) return;
            const provider = new GoogleAuthProvider(); // Instantiated here!
            try {
                await signInWithPopup(auth, provider);
                authModal.classList.add('invisible', 'opacity-0');
            } catch (error) {
                console.error("Google Sign-In Error:", error);
                displayAuthMessage(`Google sign-in failed: ${error.message.split('(')[0].trim()}`);
            }
        });
        // ------------------------------------------------------------------

        anonSignInBtn.addEventListener('click', async () => {
            if (!auth) return;
            try {
                await signInAnonymously(auth);
                authModal.classList.add('invisible', 'opacity-0');
            } catch (error) {
                console.error("Anonymous Sign-In Error:", error);
                displayAuthMessage("Anonymous sign-in failed.");
            }
        });

        emailAuthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!auth) return;

            const email = emailInput.value;
            const password = passwordInput.value;
            authMessage.textContent = 'Processing...';

            try {
                // Try signing in first
                await signInWithEmailAndPassword(auth, email, password);
                authModal.classList.add('invisible', 'opacity-0');
            } catch (signInError) {
                // If sign-in fails, try creating a new account
                if (signInError.code === 'auth/user-not-found') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                        authModal.classList.add('invisible', 'opacity-0');
                    } catch (signUpError) {
                        console.error("Sign-Up Error:", signUpError);
                        displayAuthMessage(`Sign Up failed: ${signUpError.message}`);
                    }
                } else {
                    console.error("Sign-In Error:", signInError);
                    displayAuthMessage(`Sign In failed: ${signInError.message}`);
                }
            }
        });

        signOutBtn.addEventListener('click', async () => {
            if (!auth) return;
            try {
                await signOut(auth);
                authModal.classList.add('invisible', 'opacity-0');
            } catch (error) {
                console.error("Sign Out Error:", error);
            }
        });

        updateNameForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newName = displayNameInput.value.trim();
            if (!currentUser || !newName) return;

            try {
                // 1. Update Firebase Auth profile
                await updateProfile(currentUser, { displayName: newName });
                
                // 2. Update Firestore profile document
                await saveUserProfile(currentUser);

                // UI update handles itself via onAuthStateChanged or the state listener
                displayAuthMessage('Display name updated successfully!', false);
                updateUIForUser(currentUser); // Force UI update
            } catch (error) {
                console.error("Error updating profile:", error);
                displayAuthMessage("Failed to update profile name.");
            }
        });

        // --- UI Logic ---
        profileBtn.addEventListener('click', () => {
            authModal.classList.remove('invisible', 'opacity-0');
            authModal.classList.add('visible', 'opacity-100');
        });

        closeModalBtn.addEventListener('click', () => {
            authModal.classList.add('invisible', 'opacity-0');
            authModal.classList.remove('visible', 'opacity-100');
        });

        // --- Core Application Logic ---

        function renderFeedItems(items) {
            feedCount.textContent = items.length;
            feedList.innerHTML = '';

            if (items.length === 0) {
                feedList.innerHTML = `
                    <p class="text-gray-500 p-4 text-center border-dashed border-2 rounded-xl">
                        The feed is empty. Post the first item!
                    </p>`;
                return;
            }

            items.sort((a, b) => b.createdAt - a.createdAt).forEach(item => {
                const li = document.createElement('div');
                const isOld = (Date.now() - item.createdAt) > (TTL_DAYS * 24 * 60 * 60 * 1000);
                
                const statusIcon = isOld 
                    ? '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>';

                const statusBadge = isOld
                    ? `<span class="flex items-center text-xs font-semibold px-2 py-1 rounded-full bg-red-100 text-red-600">${statusIcon} OLD (Check TTL)</span>`
                    : `<span class="flex items-center text-xs font-semibold px-2 py-1 rounded-full bg-green-100 text-green-600">${statusIcon} Active Item</span>`;

                const authorName = item.authorName || 'User';

                li.className = `p-4 rounded-xl shadow-md transition-all duration-300 ${isOld ? 'bg-red-50 border-red-200' : 'bg-white border-gray-100'}`;
                li.innerHTML = `
                    <p class="text-gray-800 font-medium mb-2">${item.text}</p>
                    <div class="flex justify-between items-center text-xs pt-2 border-t border-dashed border-gray-200">
                        <span class="text-gray-500 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${formatTimestamp(item.createdAt)}
                        </span>
                        <span class="text-gray-600 font-semibold">${authorName}</span>
                        ${statusBadge}
                    </div>
                `;
                feedList.appendChild(li);
            });
        }

        async function fetchAuthorName(authorUid) {
            const profilePath = `artifacts/${appId}/users/${authorUid}/${PROFILES_COLLECTION}`;
            const docRef = doc(db, profilePath, 'data');
            
            try {
                const docSnap = await getDocs(collection(db, profilePath));
                if (!docSnap.empty) {
                    const data = docSnap.docs[0].data();
                    return data.displayName || 'Unknown User';
                }
                return 'Unknown User';
            } catch (error) {
                console.error("Error fetching author name:", error);
                return 'Unknown User';
            }
        }


        /** Sets up the real-time listener for the feed data. */
        function setupRealtimeListener() {
            if (!isAuthReady || !currentUser) return;

            const dataPath = getCollectionPath(POSTS_COLLECTION);
            if (!dataPath) return;

            const q = query(collection(db, dataPath));

            onSnapshot(q, async (snapshot) => {
                const items = [];
                const profilePromises = [];
                const profileCache = {};

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const item = {
                        id: doc.id,
                        text: data.text,
                        createdAt: data.createdAt,
                        authorId: data.authorId || currentUser.uid // Fallback for old posts
                    };
                    items.push(item);

                    // Fetch profile if not cached
                    if (!profileCache[item.authorId]) {
                        profileCache[item.authorId] = fetchAuthorName(item.authorId);
                        profilePromises.push(profileCache[item.authorId]);
                    }
                });

                // Wait for all profile lookups to resolve (even though currently all posts are local)
                await Promise.all(profilePromises);

                // Attach resolved names and render
                const renderedItems = items.map(item => ({
                    ...item,
                    authorName: item.authorId === currentUser.uid ? currentUser.displayName || 'You' : profileCache[item.authorId]
                }));
                
                renderFeedItems(renderedItems);
            }, (error) => {
                console.error("Error setting up snapshot listener:", error);
            });
        }

        postForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = newItemText.value.trim();
            if (!text || !currentUser) return;

            const dataPath = getCollectionPath(POSTS_COLLECTION);
            if (!dataPath) return;

            postBtn.disabled = true;

            addDoc(collection(db, dataPath), {
                text: text,
                createdAt: Date.now(),
                authorId: currentUser.uid // Store author UID
            }).then(() => {
                newItemText.value = '';
            }).catch(error => {
                console.error("Error adding document:", error);
            }).finally(() => {
                postBtn.disabled = false;
            });
        });

        // --- Initialization ---

        function initFirebaseAndAuth() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Initial Sign-In with Canvas token
                if (initialAuthToken) {
                    signInWithCustomToken(auth, initialAuthToken)
                        .catch(error => {
                            console.error("Custom token sign-in failed. Falling back to anonymous.", error);
                            signInAnonymously(auth);
                        });
                } else {
                    signInAnonymously(auth);
                }

                // Auth State Listener
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        isAuthReady = true;
                        currentUser = user;

                        // 1. Update UI and save profile immediately
                        updateUIForUser(user);
                        await saveUserProfile(user);

                        // 2. **MANDATORY**: RUN THE TTL CHECK (relies on currentUser being set)
                        await checkAndDeleteOldData();

                        // 3. Start Real-time Data Display
                        setupRealtimeListener();

                    } else {
                        isAuthReady = false;
                        currentUser = null;
                        updateUIForUser(null);
                        loadingIndicator.classList.remove('hidden');
                        mainContent.classList.add('hidden');
                        loadingIndicator.textContent = "Please sign in to view the feed.";
                    }
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                loadingIndicator.textContent = "Error initializing Firebase. Check console for details.";
            }
        }

        window.onload = initFirebaseAndAuth;

    </script>
</body>
</html>
